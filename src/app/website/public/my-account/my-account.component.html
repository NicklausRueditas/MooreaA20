<div class="min-h-screen bg-gray-50 py-10">
  <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
    <!-- Título de sección (Visible solo en móvil para contexto) -->
    <h1 class="text-2xl font-bold text-gray-900 mb-6 md:hidden">Mi Cuenta</h1>

    <div class="lg:grid lg:grid-cols-12 lg:gap-x-8">
      <!-- Sidebar de Navegación -->
      <aside class="lg:col-span-3 mb-6 lg:mb-0">
        <nav class="space-y-1">
          <!-- Tarjeta de Usuario Resumen -->
          @if (user$ | async; as user) {
            <div class="bg-white overflow-hidden shadow-sm rounded-xl mb-4">
              <div class="p-5 flex items-center space-x-4">
                <div class="flex-shrink-0">
                  @if (user.profilePicture && !imageError) {
                    <img
                      class="h-12 w-12 rounded-full object-cover border-2 border-primary/20"
                      [src]="user.profilePicture"
                      [alt]="user.displayName"
                      (error)="onImageError()"
                    />
                  } @else {
                    <div
                      class="h-12 w-12 rounded-full bg-primary/10 flex items-center justify-center border-2 border-primary/20"
                    >
                      <span class="text-lg font-semibold text-primary">{{
                        (user.displayName || "U").charAt(0)
                      }}</span>
                    </div>
                  }
                </div>
                <div class="flex-1 min-w-0">
                  <p class="text-sm font-medium text-gray-900 truncate">
                    {{ user.displayName }}
                  </p>
                  <p class="text-xs text-gray-500 truncate">
                    {{ user.email }}
                  </p>
                </div>
              </div>
            </div>
          }

          <!-- Menú de Enlaces -->
          <div class="bg-white shadow-sm rounded-xl overflow-hidden">
            <div class="p-2 space-y-1">
              <!-- Perfil -->
              <a
                routerLink="profile"
                routerLinkActive="bg-rose-50 text-rose-700 font-semibold"
                class="group flex items-center px-3 py-2.5 text-sm font-medium rounded-lg text-gray-700 hover:text-rose-700 hover:bg-rose-50 transition-colors"
                aria-current="page"
              >
                <span
                  class="mr-3 flex-shrink-0 h-6 w-6 flex items-center justify-center text-gray-400 group-hover:text-rose-500 router-link-active:text-rose-500"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="w-5 h-5"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"
                    />
                  </svg>
                </span>
                <span class="truncate">Mi Perfil</span>
              </a>

              <!-- Direcciones -->
              <a
                routerLink="addresses"
                routerLinkActive="bg-rose-50 text-rose-700 font-semibold"
                class="group flex items-center px-3 py-2.5 text-sm font-medium rounded-lg text-gray-700 hover:text-rose-700 hover:bg-rose-50 transition-colors"
              >
                <span
                  class="mr-3 flex-shrink-0 h-6 w-6 flex items-center justify-center text-gray-400 group-hover:text-rose-500 router-link-active:text-rose-500"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="w-5 h-5"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M15 10.5a3 3 0 11-6 0 3 3 0 016 0z"
                    />
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1115 0z"
                    />
                  </svg>
                </span>
                <span class="truncate">Direcciones</span>
              </a>

              <!-- Métodos de Pago -->
              <a
                routerLink="cards"
                routerLinkActive="bg-rose-50 text-rose-700 font-semibold"
                class="group flex items-center px-3 py-2.5 text-sm font-medium rounded-lg text-gray-700 hover:text-rose-700 hover:bg-rose-50 transition-colors"
              >
                <span
                  class="mr-3 flex-shrink-0 h-6 w-6 flex items-center justify-center text-gray-400 group-hover:text-rose-500 router-link-active:text-rose-500"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="w-5 h-5"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 002.25-2.25V6.75A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25v10.5A2.25 2.25 0 004.5 19.5z"
                    />
                  </svg>
                </span>
                <span class="truncate">Métodos de Pago</span>
              </a>

              <!-- Mis Órdenes -->
              <a
                routerLink="orders"
                routerLinkActive="bg-rose-50 text-rose-700 font-semibold"
                class="group flex items-center px-3 py-2.5 text-sm font-medium rounded-lg text-gray-700 hover:text-rose-700 hover:bg-rose-50 transition-colors"
              >
                <span class="mr-3 flex-shrink-0 h-6 w-6 flex items-center justify-center text-gray-400 group-hover:text-rose-500">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                      d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
                  </svg>
                </span>
                <span class="truncate">Mis Órdenes</span>
              </a>

              <!-- Conviértete en Seller -->
              <a
                routerLink="become-seller"
                routerLinkActive="bg-violet-50 text-violet-700 font-semibold"
                class="group flex items-center px-3 py-2.5 text-sm font-medium rounded-lg text-gray-700 hover:text-violet-700 hover:bg-violet-50 transition-colors"
              >
                <span class="mr-3 flex-shrink-0 h-6 w-6 flex items-center justify-center text-gray-400 group-hover:text-violet-500">
                  <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                    <path stroke-linecap="round" stroke-linejoin="round"
                      d="M13.5 21v-7.5a.75.75 0 01.75-.75h3a.75.75 0 01.75.75V21m-4.5 0H2.36m11.14 0H18m0 0h3.64m-1.39 0V9.349m-16.5 11.65V9.35m0 0a3.001 3.001 0 003.75-.615A2.993 2.993 0 009.75 9.75c.896 0 1.7-.393 2.25-1.016a2.993 2.993 0 002.25 1.016c.896 0 1.7-.393 2.25-1.016a3.001 3.001 0 003.75.614m-16.5 0a3.004 3.004 0 01-.621-4.72L4.318 3.44A1.5 1.5 0 015.378 3h13.243a1.5 1.5 0 011.06.44l1.19 1.189a3 3 0 01-.621 4.72m-13.5 8.65h3.75a.75.75 0 00.75-.75V13.5a.75.75 0 00-.75-.75H6.75a.75.75 0 00-.75.75v3.75c0 .415.336.75.75.75z" />
                  </svg>
                </span>
                <span class="truncate">Vender en Moorea</span>
                <span class="ml-auto text-[9px] font-black px-1.5 py-0.5 bg-violet-100 text-violet-700 rounded-full">NUEVO</span>
              </a>

              <!-- Separador -->
              <div class="border-t border-gray-100 my-2"></div>

              <!-- Cerrar Sesión -->
              <button
                class="w-full group flex items-center px-3 py-2.5 text-sm font-medium rounded-lg text-gray-700 hover:text-red-700 hover:bg-red-50 transition-colors text-left"
              >
                <span
                  class="mr-3 flex-shrink-0 h-6 w-6 flex items-center justify-center text-gray-400 group-hover:text-red-500"
                >
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke-width="1.5"
                    stroke="currentColor"
                    class="w-5 h-5"
                  >
                    <path
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75"
                    />
                  </svg>
                </span>
                <span class="truncate">Cerrar Sesión</span>
              </button>
            </div>
          </div>
        </nav>
      </aside>

      <!-- Contenido Principal -->
      <div class="lg:col-span-9">
        <div class="bg-white shadow-sm rounded-xl min-h-[500px] p-6">
          <router-outlet></router-outlet>
        </div>
      </div>
    </div>
  </div>
</div>
