@if(related.length > 0 || loading) {
<section class="related-section mt-10">

  <div class="mb-6 select-none">
    <h2 class="text-xl font-bold text-slate-900 tracking-tight">Más de {{ product.brand }}</h2>
    <p class="text-xs text-slate-400 mt-1">Otros productos de la misma marca que te pueden interesar</p>
  </div>

  <!-- Loading Skeleton -->
  @if(loading) {
  <div class="flex gap-4 overflow-x-auto pb-3" style="scrollbar-width: none; -ms-overflow-style: none;">
    @for(i of [1,2,3,4]; track i) {
    <div class="animate-pulse flex-none w-52 rounded-2xl border border-slate-100 bg-white overflow-hidden shadow-sm">
      <div class="h-52 bg-slate-100"></div>
      <div class="p-4 space-y-3">
        <div class="h-3.5 rounded bg-slate-200 w-3/4"></div>
        <div class="h-3 rounded bg-slate-200 w-1/2"></div>
      </div>
    </div>
    }
  </div>
  }

  <!-- Carousel / Slider -->
  @if(!loading && related.length > 0) {
  <div class="related-slider flex gap-4 overflow-x-auto pb-3" style="scrollbar-width: none; -ms-overflow-style: none;">

    @for(item of related; track item._id) {
    <button type="button" (click)="goToProduct(item)"
      class="related-card group flex-none w-52 rounded-2xl border border-slate-100/80 bg-white text-left shadow-sm
             hover:shadow-md hover:border-slate-200 hover:-translate-y-1 transition-all duration-250 overflow-hidden focus:outline-none cursor-pointer">

      <!-- Product Image -->
      <div class="relative h-52 overflow-hidden bg-slate-50">
        <img [src]="thumbnail(item) | cloudinary:'w_400,c_fill,q_auto,f_auto'"
          [alt]="item.name"
          class="h-full w-full object-cover group-hover:scale-[1.03] transition-transform duration-300"
          (error)="$any($event.target).src='assets/images/placeholder.svg'">

        <!-- Discount badge -->
        @if(item.discount > 0) {
        <span class="absolute top-3 left-3 rounded-lg bg-rose-500 px-2 py-1 text-[10px] font-bold text-white shadow-sm uppercase tracking-wide">
          -{{ item.discount }}%
        </span>
        }
      </div>

      <!-- Info details -->
      <div class="p-4 space-y-2">
        <div>
          <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest truncate">{{ item.brand }}</p>
          <p class="mt-0.5 text-xs font-bold text-slate-800 leading-snug line-clamp-2 h-8.5">{{ item.name }}</p>
        </div>

        <!-- Price display -->
        <div class="flex items-baseline gap-1.5 flex-wrap pt-1 border-t border-slate-50">
          <span class="text-sm font-extrabold text-slate-900">S/ {{ finalPrice(item) | number:'1.2-2' }}</span>
          @if(item.discount > 0) {
          <span class="text-[10px] text-slate-400 line-through">S/ {{ item.basePrice | number:'1.2-2' }}</span>
          }
        </div>

        <!-- Star Rating indicator -->
        @if(item.rating && item.rating.count > 0) {
        <div class="flex items-center gap-1 text-[11px] font-semibold text-slate-500">
          <svg class="h-3.5 w-3.5 text-amber-400" fill="currentColor" viewBox="0 0 20 20">
            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
          </svg>
          <span>{{ item.rating.average | number:'1.1-1' }}</span>
          <span class="text-slate-400">({{ item.rating.count }})</span>
        </div>
        } @else {
          <!-- Empty rating slot for structural alignment -->
          <div class="h-4"></div>
        }
      </div>
    </button>
    }

  </div>
  }

</section>
}
