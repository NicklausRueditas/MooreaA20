@if(related.length > 0 || loading) {
<section class="related-section mt-16">

  <div class="mb-6">
    <h2 class="text-2xl font-bold text-gray-900 tracking-tight">Más de {{ product.brand }}</h2>
    <p class="text-sm text-gray-500 mt-0.5">Otros productos de la misma marca que te pueden interesar</p>
  </div>

  <!-- Skeleton -->
  @if(loading) {
  <div class="flex gap-4 overflow-x-auto pb-2">
    @for(i of [1,2,3,4]; track i) {
    <div class="animate-pulse flex-none w-52 rounded-2xl border border-gray-100 bg-white overflow-hidden shadow-sm">
      <div class="h-52 bg-gray-200"></div>
      <div class="p-3 space-y-2">
        <div class="h-3 rounded bg-gray-200 w-3/4"></div>
        <div class="h-3 rounded bg-gray-200 w-1/2"></div>
      </div>
    </div>
    }
  </div>
  }

  <!-- Carousel -->
  @if(!loading && related.length > 0) {
  <div class="related-slider flex gap-4 overflow-x-auto pb-3">

    @for(item of related; track item._id) {
    <button type="button" (click)="goToProduct(item)"
      class="related-card group flex-none w-52 rounded-2xl border border-gray-100 bg-white text-left shadow-sm
             hover:shadow-lg hover:-translate-y-1 transition-all duration-200 overflow-hidden focus:outline-none">

      <!-- Imagen -->
      <div class="relative h-52 overflow-hidden bg-gray-50">
        <img [src]="thumbnail(item) | cloudinary:'w_400,c_fill,q_auto,f_auto'"
          [alt]="item.name"
          class="h-full w-full object-cover group-hover:scale-105 transition-transform duration-300">

        <!-- Badge descuento -->
        @if(item.discount > 0) {
        <span class="absolute top-2 left-2 rounded-lg bg-primary px-2 py-0.5 text-xs font-bold text-white shadow">
          -{{ item.discount }}%
        </span>
        }
      </div>

      <!-- Info -->
      <div class="p-3">
        <p class="text-xs font-medium text-gray-400 uppercase tracking-wider truncate">{{ item.brand }}</p>
        <p class="mt-0.5 text-sm font-semibold text-gray-800 leading-snug line-clamp-2">{{ item.name }}</p>

        <!-- Precio -->
        <div class="mt-2 flex items-baseline gap-1.5 flex-wrap">
          <span class="text-base font-bold text-gray-900">${{ finalPrice(item) | number:'1.0-0' }}</span>
          @if(item.discount > 0) {
          <span class="text-xs text-gray-400 line-through">${{ item.basePrice | number:'1.0-0' }}</span>
          }
        </div>

        <!-- Rating si existe -->
        @if(item.rating && item.rating.count > 0) {
        <div class="mt-1.5 flex items-center gap-1">
          <svg class="h-3.5 w-3.5 text-yellow-400" fill="currentColor" viewBox="0 0 20 20">
            <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
          </svg>
          <span class="text-xs font-medium text-gray-600">{{ item.rating.average }}</span>
          <span class="text-xs text-gray-400">({{ item.rating.count }})</span>
        </div>
        }
      </div>
    </button>
    }

  </div>
  }

</section>
}
