version: '3.8'

services:
  angular-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: angular17-dev
    ports:
      - "4200:4200"
    volumes:
      # Mount source code for hot reload
      - ./src:/app/src
      - ./angular.json:/app/angular.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./tsconfig.app.json:/app/tsconfig.app.json
      - ./.postcssrc.json:/app/.postcssrc.json
      # Prevent node_modules from being overwritten
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    stdin_open: true
    tty: true
    networks:
      - angular-network

networks:
  angular-network:
    driver: bridge
